name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in Bullseye
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible so the maintainers can reproduce and resolve it.
        If this is an accessibility issue (e.g., keyboard trap, missing contrast, broken screen reader announcement), please detail the assistive tech used.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A concise description of what went wrong.
      placeholder: e.g. Focus ring clipped on 'Join Class' modal button in Safari
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What sequence of actions leads to the bug?
      placeholder: |
        1. Open http://localhost:5173
        2. Press 'Tab' to navigate to the lecture horizon card
        3. Activate 'Help me rejoin'
        4. Observe focus indicator
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A 3px high-contrast focus ring should remain visible around the control.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred?
      placeholder: The focus indicator disappears or is clipped by the overflow container.
    validations:
      required: true

  - type: dropdown
    id: a11y_impact
    attributes:
      label: Accessibility Impact (WCAG 2.2 AA)
      description: Does this bug prevent an accessible user interaction?
      options:
        - "None / General UI Bug"
        - "Keyboard Navigation / Focus Indicator Issue"
        - "Screen Reader / ARIA Announcement Issue"
        - "Contrast / Visual Legibility Issue"
        - "Motion / Sensory Sensitivity Issue"
        - "Cognitive Load / Working Memory Barrier"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & System Details
      description: Browser version, OS, assistive technology (e.g., VoiceOver, NVDA, JAWS).
      placeholder: e.g. macOS 15.1, Chrome 128, VoiceOver enabled
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Console Logs or Screenshots
      description: Paste any error stack traces or drag-and-drop screenshots here.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I verified that this does not contain sensitive personal student data or secrets.
          required: true
