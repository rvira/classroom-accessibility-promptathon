<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <rect id="canvas" width="1280" height="720" fill="#F7F8F5"/>

    <!-- Soft Drop Shadows -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00695C" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00695C" />
    </marker>
  </defs>

  <!-- Slide Canvas Base -->
  <use href="#canvas"/>

  <!-- Margin: 48px standard boundary -->
  <g transform="translate(48, 48)">

    <!-- Slide Header -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="10" stroke="#00695C" stroke-width="2.5" fill="none"/>
      <circle cx="12" cy="12" r="6" stroke="#00695C" stroke-width="2.5" fill="none"/>
      <circle cx="12" cy="12" r="2.5" fill="#00695C"/>
      <text x="32" y="19" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#00695C" letter-spacing="-0.5">bullseye ·</text>

      <rect x="990" y="0" width="194" height="28" rx="14" fill="#E2F3EC" stroke="rgba(0,105,92,0.2)"/>
      <text x="1087" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00695C" letter-spacing="1">SYSTEM ARCHITECTURE</text>
    </g>

    <!-- Title & Lead -->
    <g transform="translate(0, 50)">
      <text x="0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#172B32" letter-spacing="-0.5">Full Stack Flow: Unifying Disjointed Campus Tools</text>
      <text x="0" y="62" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4B6066">Real-time classroom inputs transform into one synchronized, distraction-free layer.</text>
    </g>

    <!-- Visual Architecture Diagram Stage -->
    <g transform="translate(0, 140)">
      
      <!-- COLUMN 1: LIVE CLASSROOM INPUTS -->
      <g transform="translate(0, 20)">
        <text x="160" y="-12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#6B7E80" letter-spacing="1.5">LIVE CAMPUS INPUTS</text>
        
        <!-- Input 1: Canvas LMS -->
        <g transform="translate(0, 10)" filter="url(#cardShadow)">
          <rect width="320" height="80" rx="14" fill="#FFFFFF" stroke="#CEDBD7"/>
          <rect x="16" y="18" width="44" height="44" rx="10" fill="#FEE2E2"/>
          <text x="38" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#B42318">C</text>
          <text x="76" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172B32">Canvas LMS API</text>
          <text x="76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4B6066">Modules, rubrics &amp; deadlines</text>
        </g>

        <!-- Input 2: EdStem Q&A -->
        <g transform="translate(0, 110)" filter="url(#cardShadow)">
          <rect width="320" height="80" rx="14" fill="#FFFFFF" stroke="#CEDBD7"/>
          <rect x="16" y="18" width="44" height="44" rx="10" fill="#CCFBF1"/>
          <text x="38" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#00796B">Ed</text>
          <text x="76" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172B32">EdStem Live Q&amp;A</text>
          <text x="76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4B6066">In-class student questions &amp; TAs</text>
        </g>

        <!-- Input 3: Teacher Mic Stream -->
        <g transform="translate(0, 210)" filter="url(#cardShadow)">
          <rect width="320" height="80" rx="14" fill="#FFFFFF" stroke="#CEDBD7"/>
          <rect x="16" y="18" width="44" height="44" rx="10" fill="#DCFCE7"/>
          <text x="38" y="46" text-anchor="middle" font-size="18">🎙️</text>
          <text x="76" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172B32">Instructor Stream</text>
          <text x="76" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4B6066">Live audio checkpoint sync (34:12)</text>
        </g>
      </g>

      <!-- Connecting Flow Arrows 1 -> 2 -->
      <line x1="335" y1="70" x2="430" y2="175" stroke="#00695C" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
      <line x1="335" y1="170" x2="430" y2="185" stroke="#00695C" stroke-width="2.5" marker-end="url(#arrow)"/>
      <line x1="335" y1="270" x2="430" y2="195" stroke="#00695C" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

      <!-- COLUMN 2: BULLSEYE PROCESSING CORE -->
      <g transform="translate(440, 20)" filter="url(#softGlow)">
        <rect width="300" height="290" rx="20" fill="#E2F3EC" stroke="#00695C" stroke-width="2.5"/>
        
        <circle cx="150" cy="45" r="22" fill="#00695C"/>
        <text x="150" y="52" text-anchor="middle" font-size="20">🎯</text>
        
        <text x="150" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#00695C">BULLSEYE ENGINE</text>
        <text x="150" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4B6066">Now-First Processing Core</text>

        <g transform="translate(24, 130)">
          <rect width="252" height="32" rx="8" fill="#FFFFFF" stroke="rgba(0,105,92,0.2)"/>
          <text x="126" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172B32">Task Decomposition</text>
        </g>

        <g transform="translate(24, 170)">
          <rect width="252" height="32" rx="8" fill="#FFFFFF" stroke="rgba(0,105,92,0.2)"/>
          <text x="126" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172B32">Constraint Preservation</text>
        </g>

        <g transform="translate(24, 210)">
          <rect width="252" height="32" rx="8" fill="#FFFFFF" stroke="rgba(0,105,92,0.2)"/>
          <text x="126" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172B32">Safe 10s Rejoin Generation</text>
        </g>

        <g transform="translate(24, 252)">
          <text x="126" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00695C">✓ Zero Hallucination Guarantee</text>
        </g>
      </g>

      <!-- Connecting Flow Arrows 2 -> 3 -->
      <line x1="755" y1="175" x2="850" y2="70" stroke="#00695C" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
      <line x1="755" y1="185" x2="850" y2="170" stroke="#00695C" stroke-width="2.5" marker-end="url(#arrow)"/>
      <line x1="755" y1="195" x2="850" y2="270" stroke="#00695C" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

      <!-- COLUMN 3: STUDENT EXPERIENCES -->
      <g transform="translate(860, 20)">
        <text x="160" y="-12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#6B7E80" letter-spacing="1.5">STREAMLINED VIEWS</text>
        
        <!-- View 1 -->
        <g transform="translate(0, 10)" filter="url(#cardShadow)">
          <rect width="320" height="80" rx="14" fill="#FFFFFF" stroke="#00695C" stroke-width="1.8"/>
          <rect x="16" y="22" width="36" height="36" rx="8" fill="#E2F3EC"/>
          <text x="34" y="46" text-anchor="middle" font-size="16">🎯</text>
          <text x="64" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#172B32">Now Focus View</text>
          <text x="64" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4B6066">1 active card for zero anxiety</text>
        </g>

        <!-- View 2 -->
        <g transform="translate(0, 110)" filter="url(#cardShadow)">
          <rect width="320" height="80" rx="14" fill="#FFFFFF" stroke="#CEDBD7"/>
          <rect x="16" y="22" width="36" height="36" rx="8" fill="#EEF2F0"/>
          <text x="34" y="46" text-anchor="middle" font-size="16">📋</text>
          <text x="64" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172B32">All Steps Overview</text>
          <text x="64" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4B6066">4-step sequence &amp; roadmapping</text>
        </g>

        <!-- View 3 -->
        <g transform="translate(0, 210)" filter="url(#cardShadow)">
          <rect width="320" height="80" rx="14" fill="#FFFFFF" stroke="#CEDBD7"/>
          <rect x="16" y="22" width="36" height="36" rx="8" fill="#EEF2F0"/>
          <text x="34" y="46" text-anchor="middle" font-size="16">📅</text>
          <text x="64" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172B32">Class Join &amp; Schedule Hub</text>
          <text x="64" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4B6066">One-click live session entry</text>
        </g>
      </g>

    </g>

    <!-- Footer Row -->
    <g transform="translate(0, 610)">
      <line x1="0" y1="0" x2="1184" y2="0" stroke="#CEDBD7" stroke-width="1"/>
      <text x="0" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4B6066">
        Signal / Bullseye Technical Architecture · Live Synchronization &amp; LMS Interoperability
      </text>
      <text x="1184" y="20" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4B6066">
        04 / 06
      </text>
    </g>

  </g>
</svg>